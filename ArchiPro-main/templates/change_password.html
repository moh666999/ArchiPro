<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>تغيير كلمة المرور - ArchiPro</title>

    <style>

        body {
            margin: 0;
            background: #eeeeee;
            font-family: Arial, Tahoma, sans-serif;
        }

        .window {
            width: 500px;
            margin: 70px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
        }

        .row {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        button,
        a {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #2d6cdf;
            color: white;
        }

        a {
            background: #666;
            color: white;
        }

    </style>

</head>

<body>

<div class="window">

    <h1>تغيير كلمة المرور</h1>

    <form method="POST">

        <div class="row">

            <label>
                كلمة المرور الحالية
            </label>

            <input
                type="password"
                name="old_password"
                required
            >

        </div>


        <div class="row">

            <label>
                كلمة المرور الجديدة
            </label>

            <input
                type="password"
                name="new_password"
                required
            >

        </div>


        <div class="row">

            <label>
                تأكيد كلمة المرور الجديدة
            </label>

            <input
                type="password"
                name="confirm_password"
                required
            >

        </div>


        <div class="buttons">

            <button type="submit">
                حفظ
            </button>

            <a
                href="{{ url_for('dashboard') }}"
            >
                إلغاء
            </a>

        </div>

    </form>

</div>

</body>

</html>
